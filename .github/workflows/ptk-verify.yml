# All jobs depend on setup; only configured producer needs supply artifacts.
# A consumer waits for all variants of each producer, then downloads its matching variant.
# Downloads replace declared paths; do not declare source roots or overlapping outputs.
# Upload runs after a failed job too, for outputs from successfully completed steps.
name: PTK verify
'on':
  workflow_call:
    inputs:
      runner:
        description: 'TODO: select your Linux Docker-capable runner label'
        type: string
        required: true
      container-image:
        description: 'TODO: image with PTK, Python 3.12+, bash, curl and project tools'
        type: string
        required: true
      project-directory:
        description: Workflow owner directory inside the checkout/VMR
        type: string
        default: .
      variants:
        description: Owner variant names/aliases, comma-separated; empty selects all concrete variants
        type: string
        default: ''
      no-cache-ptk:
        description: Disable PTK output reuse
        type: boolean
        default: false
      additional-properties:
        description: Extra Artifactory properties as a JSON object
        type: string
        default: '{}'
    secrets:
      PTK_ARTIFACT_USER:
        required: true
      PTK_ARTIFACT_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  setup:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    outputs:
      matrix_check: ${{ steps.matrix.outputs.matrix_check }}
      matrix_test: ${{ steps.matrix.outputs.matrix_test }}
      matrix_package: ${{ steps.matrix.outputs.matrix_package }}
      matrix_docs: ${{ steps.matrix.outputs.matrix_docs }}
      matrix_extension: ${{ steps.matrix.outputs.matrix_extension }}
      upload_base: ${{ steps.matrix.outputs.upload_base }}
    steps:
    - uses: actions/checkout@v4
    - name: Export PTK variant matrix
      id: matrix
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        PTK_WORKFLOW: verify
        PTK_VARIANTS: ${{ inputs.variants }}
      run: 'args=()

        if [[ -n "$PTK_VARIANTS" ]]; then args+=(-V "$PTK_VARIANTS"); fi

        ptk "${args[@]}" maintainer matrix --workflow "$PTK_WORKFLOW" --format github >> "$GITHUB_OUTPUT"

        '
  check:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    needs:
    - setup
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix_check) }}
    steps:
    - uses: actions/checkout@v4
    - name: Run PTK job
      id: run
      uses: eadeva/dummy/.github/actions/ptk-run-job@codex/decentralized-configuration
      with:
        job: ${{ matrix.job }}
        variant: ${{ matrix.variant }}
        params: ${{ toJSON(matrix.params) }}
        maintainer: ${{ matrix.maintainer }}
        working-directory: ${{ matrix.working_directory }}
        no-cache: ${{ inputs.no-cache-ptk }}
    - name: Upload declared outputs
      uses: eadeva/dummy/.github/actions/ptk-upload@codex/decentralized-configuration
      if: ${{ !cancelled() && steps.run.outputs.uploads-json != '' }}
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        base-url: ${{ matrix.upload.url }}
        producer: ${{ toJSON(matrix) }}
        uploads-json: ${{ steps.run.outputs.uploads-json }}
        working-directory: ${{ matrix.working_directory }}
        additional_properties: ${{ inputs.additional-properties }}
  test:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    needs:
    - setup
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix_test) }}
    steps:
    - uses: actions/checkout@v4
    - name: Run PTK job
      id: run
      uses: eadeva/dummy/.github/actions/ptk-run-job@codex/decentralized-configuration
      with:
        job: ${{ matrix.job }}
        variant: ${{ matrix.variant }}
        params: ${{ toJSON(matrix.params) }}
        maintainer: ${{ matrix.maintainer }}
        working-directory: ${{ matrix.working_directory }}
        no-cache: ${{ inputs.no-cache-ptk }}
    - name: Upload declared outputs
      uses: eadeva/dummy/.github/actions/ptk-upload@codex/decentralized-configuration
      if: ${{ !cancelled() && steps.run.outputs.uploads-json != '' }}
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        base-url: ${{ matrix.upload.url }}
        producer: ${{ toJSON(matrix) }}
        uploads-json: ${{ steps.run.outputs.uploads-json }}
        working-directory: ${{ matrix.working_directory }}
        additional_properties: ${{ inputs.additional-properties }}
  package:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    needs:
    - setup
    - check
    - test
    - extension
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix_package) }}
    steps:
    - uses: actions/checkout@v4
    - name: Download producer outputs
      uses: eadeva/dummy/.github/actions/ptk-download@codex/decentralized-configuration
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        needs: ${{ toJSON(needs) }}
        producers: ${{ toJSON(matrix.producers) }}
        working-directory: .
    - name: Run PTK job
      id: run
      uses: eadeva/dummy/.github/actions/ptk-run-job@codex/decentralized-configuration
      with:
        job: ${{ matrix.job }}
        variant: ${{ matrix.variant }}
        params: ${{ toJSON(matrix.params) }}
        maintainer: ${{ matrix.maintainer }}
        working-directory: ${{ matrix.working_directory }}
        no-cache: ${{ inputs.no-cache-ptk }}
    - name: Upload declared outputs
      uses: eadeva/dummy/.github/actions/ptk-upload@codex/decentralized-configuration
      if: ${{ !cancelled() && steps.run.outputs.uploads-json != '' }}
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        base-url: ${{ matrix.upload.url }}
        producer: ${{ toJSON(matrix) }}
        uploads-json: ${{ steps.run.outputs.uploads-json }}
        working-directory: ${{ matrix.working_directory }}
        additional_properties: ${{ inputs.additional-properties }}
  docs:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    needs:
    - setup
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix_docs) }}
    steps:
    - uses: actions/checkout@v4
    - name: Run PTK job
      id: run
      uses: eadeva/dummy/.github/actions/ptk-run-job@codex/decentralized-configuration
      with:
        job: ${{ matrix.job }}
        variant: ${{ matrix.variant }}
        params: ${{ toJSON(matrix.params) }}
        maintainer: ${{ matrix.maintainer }}
        working-directory: ${{ matrix.working_directory }}
        no-cache: ${{ inputs.no-cache-ptk }}
    - name: Upload declared outputs
      uses: eadeva/dummy/.github/actions/ptk-upload@codex/decentralized-configuration
      if: ${{ !cancelled() && steps.run.outputs.uploads-json != '' }}
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        base-url: ${{ matrix.upload.url }}
        producer: ${{ toJSON(matrix) }}
        uploads-json: ${{ steps.run.outputs.uploads-json }}
        working-directory: ${{ matrix.working_directory }}
        additional_properties: ${{ inputs.additional-properties }}
  extension:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
    needs:
    - setup
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.matrix_extension) }}
    steps:
    - uses: actions/checkout@v4
    - name: Run PTK job
      id: run
      uses: eadeva/dummy/.github/actions/ptk-run-job@codex/decentralized-configuration
      with:
        job: ${{ matrix.job }}
        variant: ${{ matrix.variant }}
        params: ${{ toJSON(matrix.params) }}
        maintainer: ${{ matrix.maintainer }}
        working-directory: ${{ matrix.working_directory }}
        no-cache: ${{ inputs.no-cache-ptk }}
    - name: Upload declared outputs
      uses: eadeva/dummy/.github/actions/ptk-upload@codex/decentralized-configuration
      if: ${{ !cancelled() && steps.run.outputs.uploads-json != '' }}
      with:
        technical-user: ${{ secrets.PTK_ARTIFACT_USER }}
        token: ${{ secrets.PTK_ARTIFACT_TOKEN }}
        base-url: ${{ matrix.upload.url }}
