name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run cmake --version
      - run: uv run ptk test
      - name: Benchmark CLI startup
        if: matrix.python == '3.12'
        run: uv run python scripts/benchmark_cli.py --rounds 5 --label ci --output .ptk/benchmark-cli.json
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group docs
      - run: uv run ptk validate --generated
      - run: uv run ptk pre-commit run --all-files --show-diff-on-failure
      - run: uv run ptk check
      - run: uv run ptk docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Select Python for graph/report browser tests
        run: uv run python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('PTK_TEST_PYTHON=' + sys.executable + '\n')"
      - run: node --test extensions/project-toolkit/test/graph-ui.test.js
      - run: uv run python scripts/report_preview.py .ptk/report-preview.html
      - run: node scripts/check_report_ui.cjs .ptk/report-preview.html
      - run: npm ci --prefix extensions/project-toolkit --include=dev
      - run: npm run check --prefix extensions/project-toolkit
      - run: node --test --test-concurrency=2 extensions/project-toolkit/test/webview.test.js extensions/project-toolkit/test/graph-editor-ui.test.js
      - run: node scripts/check_extension_ui.cjs
  vscode-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync
      - name: Select Python for real CLI integration tests
        run: uv run python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('PTK_TEST_PYTHON=' + sys.executable + '\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/project-toolkit/package-lock.json
      - run: uv run ptk extension
      - uses: actions/upload-artifact@v4
        with:
          name: project-toolkit-vsix-${{ matrix.os }}
          path: extensions/project-toolkit/*.vsix
          if-no-files-found: error
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group release --group docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/project-toolkit/package-lock.json
      - run: uv run pytest -q tests/test_package_build.py
      - run: uv run ptk package
