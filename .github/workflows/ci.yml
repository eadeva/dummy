name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group docs
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - run: xvfb-run --auto-servernum uv run pytest -q tests/test_variant_editor_gui.py
