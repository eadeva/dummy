name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run cmake --version
      - run: uv run ptk test
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group docs
      - run: uv run ptk check
      - run: uv run ptk docs
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - run: xvfb-run --auto-servernum uv run ptk test -- -q tests/test_variant_editor_gui.py
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group release --group docs
      - run: uv run ptk package
