name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run cmake --version
      - run: uv run ptk test
      - name: Benchmark CLI startup
        if: matrix.python == '3.12'
        run: uv run python scripts/benchmark_cli.py --rounds 5 --label ci --output .ptk/benchmark-cli.json
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group docs
      - run: uv run ptk check
      - run: uv run ptk docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: uv run python scripts/report_preview.py .ptk/report-preview.html
      - run: node scripts/check_report_ui.cjs .ptk/report-preview.html
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - run: xvfb-run --auto-servernum uv run ptk test -- -q tests/test_variant_editor_gui.py
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          python-version: '3.12'
      - run: uv sync --group release --group docs
      - run: uv run pytest -q tests/test_package_build.py
      - run: uv run ptk package
