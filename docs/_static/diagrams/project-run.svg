<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" role="img" aria-labelledby="title description">
<title id="title">One definition, independent variant runs</title><desc id="description">Repository configuration and developer or CI selection feed PTK preparation. Debug and release execute the same job definition independently. Each run retains its own logs, outputs, canonical results and exported reports.</desc>
