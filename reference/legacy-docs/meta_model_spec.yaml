schema_version: 1
definitions:
  ATTR_req_type: &ATTR_req_type
    type: mm-attribute
    title: req_type
    mandatory: true
    values:
    - functional
    - non-functional
    - constraint
    lifecycle_status: established
    description: Type of requirement
  ATTR_verification_criteria: &ATTR_verification_criteria
    type: mm-attribute
    title: verification_criteria
    mandatory: true
    values: str
    lifecycle_status: established
    description: Defines the criteria to verify the requirement.
  ATTR_SW_verification_level: &ATTR_SW_verification_level
    type: mm-attribute
    title: verification_level
    mandatory: true
    values:
    - review
    - sw-qualification-test
    - sw-integration-test
    - sw-component-test
    - sw-unit-test
    lifecycle_status: established
    description: Defines on which level in the process the requirement is verified.
  ATTR_legal: &ATTR_legal
    type: mm-attribute
    title: legal
    mandatory: true
    values:
    - 'true'
    - 'false'
    lifecycle_status: established
    description: The attribute defines the legal relevance of the object.
  ATTR_safety: &ATTR_safety
    type: mm-attribute
    title: safety
    mandatory: true
    values:
    - QM
    - ASIL-A
    - ASIL-B
    - ASIL-C
    - ASIL-D
    - ASIL-A(D)
    - ASIL-A(C)
    - ASIL-A(B)
    - ASIL-A(A)
    - ASIL-B(D)
    - ASIL-B(C)
    - ASIL-B(B)
    - ASIL-C(D)
    - ASIL-C(C)
    - ASIL-D(D)
    - QM(D)
    - QM(C)
    - QM(B)
    - QM(A)
    lifecycle_status: established
    description: The attribute defines the safety relevance of the object.
  ATTR_security: &ATTR_security
    type: mm-attribute
    title: security
    mandatory: true
    values:
    - 'true'
    - 'false'
    lifecycle_status: established
    description: The attribute defines the security relevance of the object.
  ATTR_supplier: &ATTR_supplier
    type: mm-attribute
    title: supplier
    mandatory: true
    values: string
    lifecycle_status: established
    description: The attributes defines the supplier of the object.
  ATTR_activation_event: &ATTR_activation_event
    type: mm-attribute
    title: activation_event
    mandatory: true
    values: string
    lifecycle_status: established
    description: 'task/runnable activation event, timer, alarm, os, data, interrupt etc.


      Could also be a link to a sw-event type.'
  ATTR_cycle_time: &ATTR_cycle_time
    type: mm-attribute
    title: cycle_time
    mandatory: true
    values: string
    lifecycle_status: established
    description: The cycle time determines how frequent the task is executed. Can be defined as a numerical value + unit for
      time. E.g., 10ms. Can also be used to determine whether it's an init task. In this case 'init' can be given as the value.
  ATTR_max_duration: &ATTR_max_duration
    type: mm-attribute
    title: max_duration
    mandatory: false
    values: int
    lifecycle_status: established
    description: Used for runnables, tasks and sequences - maximal runtime duration in ms (netto)
  ATTR_max_latency: &ATTR_max_latency
    type: mm-attribute
    title: max_latency
    mandatory: false
    values: int
    lifecycle_status: established
    description: Used for interrupts - maximal runtime latency in ms (netto)
  ATTR_priority: &ATTR_priority
    type: mm-attribute
    title: priority
    mandatory: false
    values: int
    lifecycle_status: established
    description: priorities for task starting with 1 - lowest prio to n - highest prio
  ATTR_feature_function: &ATTR_feature_function
    type: mm-attribute
    title: feature_function
    mandatory: false
    values: str
    lifecycle_status: established
    description: 'Contains the feature or function that is relevant for this test case.

      Values to be specified by each project.'
  ATTR_TC_unit_component_status: &ATTR_TC_unit_component_status
    type: mm-attribute
    title: status
    mandatory: false
    values:
    - New/Changed
    - Specified
    - Specification Reviewed
    - Implemented
    - Released
    lifecycle_status: established
    description: 'Contains the lifecycle status of the test case.

      For unit and component level test cases it defaults to ``Released`` when left unset.'
  ATTR_test_category: &ATTR_test_category
    type: mm-attribute
    title: test_category
    mandatory: false
    values:
    - Regression_Test
    - Smoke_Test
    lifecycle_status: established
    description: Contains the test category(s).
  ATTR_test_design_technique: &ATTR_test_design_technique
    type: mm-attribute
    title: test_design_technique
    mandatory: false
    values:
    - Boundary_Value_Test
    - Equivalence_Class_Test
    - Fault_Injection_Test
    - Error_Guessing_Test
    - Control_Flow_Analysis
    - Data_Flow_Analysis
    - Negative_Test
    - Positive_Test
    - Cause_Effect_Graphing
    - Classification_Tree_Technique
    - Combinatorial_Test
    - Condition_Test
    - Decision_Table_Test
    - Metamorphic_Test
    - Multiple_Condition_Test
    - Random_Test
    - State_Transition_Test
    - Syntax_Test
    lifecycle_status: established
    description: 'Contains the design test technique(s) of the test case.

      Can be extended with project-specific values.'
  ATTR_test_method: &ATTR_test_method
    type: mm-attribute
    title: test_method
    mandatory: false
    values:
    - Requirement_Based_Test
    - Use_Case_Test
    - Defect_Based_Test
    - Conformance_Test
    - Interface_Test
    - Back_to_Back_Test
    - Performance_Test
    - Stress_Test
    - Resource_Usage_Test
    lifecycle_status: established
    description: 'Contains the test method(s) of the test case.

      Can be extended with project-specific values.'
  ATTR_TC_unit_component_testcase_type: &ATTR_TC_unit_component_testcase_type
    type: mm-attribute
    title: testcase_type
    mandatory: true
    values:
    - Automated
    - Semi_Automated
    - Manual
    lifecycle_status: established
    description: 'Contains the design test case type of the test case.

      For unit and component level test cases it defaults to ``Automated`` when left unset.'
  ATTR_variant: &ATTR_variant
    type: mm-attribute
    title: variant
    mandatory: false
    values: str
    lifecycle_status: established
    description: 'Describes which product (HW & SW) variants the test artifact applies to.

      May contain multiple variants.'
  ATTR_latest_report_path: &ATTR_latest_report_path
    type: mm-attribute
    title: latest_report_path
    mandatory: false
    values: str
    lifecycle_status: established
    description: 'This attribute is auto-populated during the documentation build and must not

      be set manually. It contains a link to the test report associated with the

      latest test execution and is written by the ``verdict_overlay`` extension when

      a ``report_urls.json`` manifest sits next to the TACO result files; otherwise

      the attribute stays unset.'
  ATTR_latest_test_verdict: &ATTR_latest_test_verdict
    type: mm-attribute
    title: latest_test_verdict
    mandatory: false
    values:
    - Not executed
    - Passed
    - Failed
    - Blocked
    - Error
    lifecycle_status: established
    description: 'This attribute is auto-populated during the documentation build and must not

      be set manually. It contains the verdict of the latest test execution and is

      written by the ``verdict_overlay`` extension when TACO result files are made

      available via the ``TACO_RESULTS_DIR`` environment variable; otherwise the

      attribute stays unset.'
  ATTR_TC_legal: &ATTR_TC_legal
    type: mm-attribute
    title: legal
    mandatory: true
    values:
    - 'true'
    - 'false'
    lifecycle_status: established
    description: 'The attribute defines the legal relevance of the test case.

      It is auto-populated during the documentation build by the ``ssl_inheritance``

      extension, which inherits the value from the requirement(s) linked via the

      ``validates`` relation (``true`` takes precedence over ``false``). Manually

      entered values are overwritten and a mismatch raises a build warning.'
  ATTR_TC_safety: &ATTR_TC_safety
    type: mm-attribute
    title: safety
    mandatory: true
    values:
    - QM
    - ASIL-A
    - ASIL-B
    - ASIL-C
    - ASIL-D
    - ASIL-A(D)
    - ASIL-A(C)
    - ASIL-A(B)
    - ASIL-A(A)
    - ASIL-B(D)
    - ASIL-B(C)
    - ASIL-B(B)
    - ASIL-C(D)
    - ASIL-C(C)
    - ASIL-D(D)
    - QM(D)
    - QM(C)
    - QM(B)
    - QM(A)
    lifecycle_status: established
    description: 'The attribute defines the safety relevance (ASIL) of the test case.

      It is auto-populated during the documentation build by the ``ssl_inheritance``

      extension, which inherits the value from the requirement(s) linked via the

      ``validates`` relation (the most conservative value, i.e. the highest ASIL,

      wins). Manually entered values are overwritten and a mismatch raises a build

      warning.'
  ATTR_TC_security: &ATTR_TC_security
    type: mm-attribute
    title: security
    mandatory: true
    values:
    - 'true'
    - 'false'
    lifecycle_status: established
    description: 'The attribute defines the security relevance of the test case.

      It is auto-populated during the documentation build by the ``ssl_inheritance``

      extension, which inherits the value from the requirement(s) linked via the

      ``validates`` relation (``true`` takes precedence over ``false``). Manually

      entered values are overwritten and a mismatch raises a build warning.'
  ATTR_TC_status: &ATTR_TC_status
    type: mm-attribute
    title: status
    mandatory: true
    values:
    - New/Changed
    - Specified
    - Specification Reviewed
    - Implemented
    - Released
    lifecycle_status: established
    description: Contains the lifecycle status of the test case.
  ATTR_tags: &ATTR_tags
    type: mm-attribute
    title: tags
    mandatory: false
    values: str
    lifecycle_status: established
    description: 'Used for extra tags that describe a needs object beyond what the predefined attributes allow.

      Tags should be entered in the form of a semicolon separated list.

      See https://sphinx-needs.readthedocs.io/en/latest/directives/need.html#tags for details.

      Usage of this should be defined by the project.'
  ATTR_test_environment: &ATTR_test_environment
    type: mm-attribute
    title: test_environment
    mandatory: true
    values:
    - HiL
    - HoL
    - SiL
    - SoL
    - PiL
    - PoL
    - MiL
    - MoL
    - Vehicle
    lifecycle_status: established
    description: 'Contains the test environment for the test case.

      For unit and component level test cases it defaults to ``SiL`` when left unset.'
  ATTR_test_implementation: &ATTR_test_implementation
    type: mm-attribute
    title: test_implementation
    mandatory: false
    values: str
    lifecycle_status: established
    description: Contains an optional reference to the test implementation, e.g. a link to a test case in a test management
      tool or a file path.
  ATTR_test_implementation_id: &ATTR_test_implementation_id
    type: mm-attribute
    title: test_implementation_id
    mandatory: false
    values: str
    lifecycle_status: established
    description: Contains an optional reference to the test implementation ID, e.g. the UUID generated by vTestStudio.
  ATTR_test_tool: &ATTR_test_tool
    type: mm-attribute
    title: test_tool
    mandatory: true
    values:
    - Not_Applicable
    - GoogleTest
    - PyTest
    - RobotFramework
    - vTestStudio
    - dSPACE
    - CANoe
    lifecycle_status: established
    description: 'Contains the test tool used to implement the test artifact.

      Can be extended with project-specific values.

      For unit and component level test cases it defaults to ``GoogleTest`` when left unset.'
  ATTR_testcase_type: &ATTR_testcase_type
    type: mm-attribute
    title: testcase_type
    mandatory: true
    values:
    - Automated
    - Semi_Automated
    - Manual
    lifecycle_status: established
    description: Contains the design test case type of the test case.
  ATTR_TC_verification_level: &ATTR_TC_verification_level
    type: mm-attribute
    title: verification_level
    mandatory: true
    values:
    - Software_Unit_Verification
    - Software_Integration_Verification
    - Software_Verification
    - System_Integration_Verification
    - System_Verification
    - Vehicle_Test
    - Not_Applicable
    lifecycle_status: established
    description: 'Contains the verification level for the test case.

      For unit and component level test cases it defaults to ``Software_Unit_Verification`` when left unset.'
  ATTR_TC_verification_type: &ATTR_TC_verification_type
    type: mm-attribute
    title: verification_type
    mandatory: true
    values:
    - Dynamic_Test
    - Review
    - Simulation
    - Calculation
    - Static_Test
    - Not_Applicable
    lifecycle_status: established
    description: 'Contains the verification type of the test case.

      For unit and component level test cases it defaults to ``Dynamic_Test`` when left unset.'
  ATTR_project: &ATTR_project
    type: mm-attribute
    title: project
    mandatory: true
    values: str
    lifecycle_status: established
    description: 'Describes which project the test artifact applies to.

      May contain to multiple projects.'
  REL_SW_req_satisfies: &REL_SW_req_satisfies
    type: mm-relation
    title: req_satisfies
    target_classes:
    - CLASS_REQ_Sw
    - CLASS_REQ_Sys
    cardinality: 1..*
    lifecycle_status: established
    description: The attribute defines which requirements are satisfied by this requirement.
  REL_SW_Port_provides: &REL_SW_Port_provides
    type: mm-relation
    title: provides
    target_classes:
    - CLASS_SW_If
    cardinality: 0..1
    lifecycle_status: established
    description: The attribute links to the provided interface.
  REL_SW_Port_requires: &REL_SW_Port_requires
    type: mm-relation
    title: requires
    target_classes:
    - CLASS_SW_If
    cardinality: 0..1
    lifecycle_status: established
    description: The attribute links to the required interface.
  REL_arc_parent: &REL_arc_parent
    type: mm-relation
    title: arc_parent
    target_classes:
    - CLASS_SW_Comp
    cardinality: 0..1
    lifecycle_status: established
    description: The attribute defines the hierarchical parent of the object.
  REL_executes: &REL_executes
    type: mm-relation
    title: executes
    target_classes:
    - CLASS_SWC_SWC_Run
    - CLASS_SWC_SW_Oper
    cardinality: 0..*
    lifecycle_status: established
    description: Determines which runnables are executed in scope of which task.
  REL_validates: &REL_validates
    type: mm-relation
    title: validates
    target_classes:
    - CLASS_REQ_SwC
    cardinality: 0..*
    lifecycle_status: established
    description: Determines which requirements are validated by the test case.
classes:
- id: CLASS_BHVIEW
  type: mm-class
  title: bhview
  class_id_prefix: BHVIEW_
  long_name_english: Behavioral view
  lifecycle_status: phase-out
  section: Software Detailed Design
  description: 'Behavioral view holds the detailed design information in the form of a PlantUML behavioral diagram.


    .. Question is whether this is stil up to date since it could also hold a class diagram or some non-behavioral diagram.
    Could be replaced in future by a better type.'
- id: CLASS_DD
  type: mm-class
  title: ddec
  class_id_prefix: DD_
  long_name_english: Design Decision
  lifecycle_status: established
  section: General aspects
  description: 'Design decisions are architectural decisions made during the design process that impact the structure and
    behavior of the software system.


    Idea to have alternatives as children.


    See also description here ``infrastructure/99_infrastructure/DevelopmentDocumentation/ddec_ModelConcept.html``'
- id: CLASS_DDSG
  type: mm-class
  title: ddsg
  class_id_prefix: DDSG_
  long_name_english: Detailed Design
  lifecycle_status: established
  section: Software Detailed Design
  description: 'The detailed design comprises static and dynamic aspects, consistent with the software architecture

    It is used to construct software units consistent with the software detailed design.'
  children:
  - id: REL_DDSG_realizes
    type: mm-relation
    title: realizes
    target_classes:
    - CLASS_SWC
    cardinality: 0..*
    lifecycle_status: established
    description: Link to establish traceability from the detailed design to the software component.
- id: CLASS_FEAT
  type: mm-class
  title: feature
  class_id_prefix: FEAT_
  long_name_english: Feature
  lifecycle_status: established
  section: Requirements Elicitation
  description: 'Features describe on a high level the usage and the characteristics of a system.

    Features can be used for clustering Stakeholder requirements.'
  children:
  - id: REL_FEAT_func_parent
    type: mm-relation
    title: func_parent
    target_classes:
    - CLASS_FEAT
    cardinality: 0..1
    lifecycle_status: established
    description: The attribute defines the hierarchical parent of the feature.
- id: CLASS_REQ_HSI
  type: mm-class
  title: req-hsi
  class_id_prefix: REQ_HSI_
  long_name_english: Hardware-Software Interface Requirement
  lifecycle_status: established
  section: Hardware Requirements
  description: 'A Hardware-Software Interface (HSI) requirement specifies the binding

    technical contract between the HW and SW domains needed to guarantee their

    correct cooperation — going beyond a simple signal/data-exchange list. It

    captures, for each signal or HW component in the signal flow, both the

    characteristics of the HW involved and the strategy chosen for HW/SW

    interaction, so that neither domain can implement its side without violating

    the other''s assumptions.'
- id: CLASS_REQ_Hw
  type: mm-class
  title: req-hw
  class_id_prefix: REQ_Hw_
  long_name_english: Hardware Requirement
  lifecycle_status: established
  section: Hardware Requirements
  description: 'This is just a placeholder to trace hardware requirements from DNG.

    Requirement management for hardware requirements is done in scope of DNG.'
- id: CLASS_REQ_Stkh
  type: mm-class
  title: req-stkh
  class_id_prefix: REQ_Stkh_
  long_name_english: Stakeholder Requirement
  lifecycle_status: established
  section: Requirements Elicitation
  description: A stakeholder requirement is a requirement which specifies the needs or expectations of a stakeholder or stakeholder
    group regarding the system.
  children:
  - <<: *ATTR_legal
    id: ATTR_REQ_Stkh_legal
  - <<: *ATTR_req_type
    id: ATTR_REQ_Stkh_req_type
    values:
    - stakeholder business requirement
    - stakeholder technical requirement
  - <<: *ATTR_safety
    id: ATTR_REQ_Stkh_safety
  - <<: *ATTR_security
    id: ATTR_REQ_Stkh_security
  - id: ATTR_REQ_Stkh_status_crs
    type: mm-attribute
    title: status_crs
    mandatory: true
    values:
    - new/changed
    - in clarification
    - accepted
    - accepted with deviation
    - accepted with deviation agreed
    - rejected
    - rejected and not agreed
    - obsolete
    lifecycle_status: established
    description: status of the stakeholder requirement
  - id: ATTR_REQ_Stkh_safety_relevance
    type: mm-attribute
    title: safety_relevance
    mandatory: true
    values:
    - 'no'
    - functional safety
    - SOTIF
    - SEooC
    - product safety
    lifecycle_status: established
    description: safety relevance of the requirement
  - id: REL_REQ_Stkh_clustered_by
    type: mm-relation
    title: clustered_by
    target_classes:
    - CLASS_FEAT
    cardinality: 1..1
    lifecycle_status: established
    description: The relation indicates that the stakeholder requirement is clustered by one or more features.
- id: CLASS_REQ_Sw
  type: mm-class
  title: req-sw
  class_id_prefix: REQ_Sw_
  long_name_english: Software Requirement
  lifecycle_status: established
  section: Software Requirements
  description: 'Software requirements specify a software component or composition on a blackbox level.


    Software Requirements can come from the following sources:


    * via a direct take over from system requirements which are mapped to SW domain


    * via non-functional requirements (e.g., from Security, Safety)


    * channeled stakeholder requirements which were identified as only SW relevant and thus are not considered on system level'
  children:
  - <<: *ATTR_legal
    id: ATTR_REQ_Sw_legal
  - <<: *ATTR_req_type
    id: ATTR_REQ_Sw_req_type
  - <<: *ATTR_safety
    id: ATTR_REQ_Sw_safety
  - <<: *ATTR_security
    id: ATTR_REQ_Sw_security
  - id: ATTR_REQ_Sw_status
    type: mm-attribute
    title: status
    mandatory: true
    values:
    - draft
    - under review
    - in clarification
    - accepted
    - rejected
    - obsolete
    lifecycle_status: established
    description: Status of the requirement
  - <<: *ATTR_verification_criteria
    id: ATTR_REQ_Sw_verification_criteria
  - <<: *ATTR_SW_verification_level
    id: ATTR_REQ_Sw_verification_level
  - <<: *REL_SW_req_satisfies
    id: REL_REQ_Sw_req_satisfies
    target_classes:
    - CLASS_REQ_Sw
    - CLASS_REQ_Sys
    - CLASS_REQ_Stkh
- id: CLASS_REQ_SwC
  type: mm-class
  title: req-swc
  class_id_prefix: REQ_SwC_
  long_name_english: Software Component Requirement
  lifecycle_status: established
  section: Software Requirements
  description: 'A software component requirement is a requirement which describes the behavior of a software component.

    It is derived from the software function breakdown.

    It usually starts with "The software component shall ...".'
  children:
  - <<: *ATTR_legal
    id: ATTR_REQ_SwC_legal
  - <<: *ATTR_req_type
    id: ATTR_REQ_SwC_req_type
  - <<: *ATTR_safety
    id: ATTR_REQ_SwC_safety
  - <<: *ATTR_security
    id: ATTR_REQ_SwC_security
  - id: ATTR_REQ_SwC_status
    type: mm-attribute
    title: status
    mandatory: true
    values:
    - draft
    - under review
    - in clarification
    - accepted
    - rejected
    - obsolete
    lifecycle_status: established
    description: Status of the requirement
  - <<: *ATTR_verification_criteria
    id: ATTR_REQ_SwC_verification_criteria
  - <<: *ATTR_SW_verification_level
    id: ATTR_REQ_SwC_verification_level
  - <<: *REL_SW_req_satisfies
    id: REL_REQ_SwC_req_satisfies
- id: CLASS_REQ_Sys
  type: mm-class
  title: req-sys
  class_id_prefix: REQ_Sys_
  long_name_english: System Requirement
  lifecycle_status: established
  section: System Requirements
  description: 'A system requirement is a requirement which specifies the behavior or other aspects (e.g., quality attributes
    like scalability, usability, ...) of the system.

    It is derived from stakeholder requirements or another level of system requirements and specifies the system functions
    which need to be fulfilled in order to provide the desired behavior or aspect.'
  children:
  - <<: *ATTR_legal
    id: ATTR_REQ_Sys_legal
  - <<: *ATTR_req_type
    id: ATTR_REQ_Sys_req_type
  - <<: *ATTR_safety
    id: ATTR_REQ_Sys_safety
  - <<: *ATTR_security
    id: ATTR_REQ_Sys_security
  - id: ATTR_REQ_Sys_status
    type: mm-attribute
    title: status
    mandatory: true
    values:
    - draft
    - under review
    - in clarification
    - accepted
    - rejected
    - obsolete
    lifecycle_status: established
    description: Status of the requirement
  - <<: *ATTR_verification_criteria
    id: ATTR_REQ_Sys_verification_criteria
  - <<: *ATTR_SW_verification_level
    id: ATTR_REQ_Sys_verification_level
    values:
    - validation
    - system-verification
    - system-integration-verification
    - software-verification
    - software-integration-verification
    - software-unit-verification
    - review
  - <<: *REL_SW_req_satisfies
    id: REL_REQ_Sys_req_satisfies
    target_classes:
    - CLASS_REQ_Sys
    - CLASS_REQ_Stkh
- id: CLASS_SWC
  type: mm-class
  title: swc
  class_id_prefix: SWC_
  long_name_english: Software Component
  lifecycle_status: established
  section: Software Architecture
  description: A software component is the smallest (reusable) element in the software architecture.
  children:
  - <<: *ATTR_legal
    id: ATTR_SWC_legal
  - <<: *ATTR_safety
    id: ATTR_SWC_safety
  - <<: *ATTR_security
    id: ATTR_SWC_security
  - <<: *ATTR_supplier
    id: ATTR_SWC_supplier
  - id: CLASS_SWC_SW_Oper
    type: mm-class
    title: sw-operation
    class_id_prefix: SW_Oper_
    long_name_english: Software Operation
    lifecycle_status: established
    description: Any kind of SW procedure which is not a runnable. However, only global operations shall be modelled on architecture
      level. Operations are entities not known to the OS.
    children:
    - <<: *ATTR_activation_event
      id: ATTR_SWC_SW_Oper_activation_event
      mandatory: false
    - <<: *ATTR_max_duration
      id: ATTR_SWC_SW_Oper_max_duration
    - <<: *ATTR_max_latency
      id: ATTR_SWC_SW_Oper_max_latency
  - id: CLASS_SWC_SW_Port
    type: mm-class
    title: sw-port
    class_id_prefix: SW_Port_
    long_name_english: Software Port
    lifecycle_status: established
    description: A software port is an interaction point of a software component to communicate with other software components.
    children:
    - <<: *REL_SW_Port_provides
