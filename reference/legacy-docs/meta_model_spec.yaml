    class_id_prefix: SWC_Run_
    long_name_english: Software Component Runnable
    lifecycle_status: established
    description: 'A SW procedure that is activated by the operating environment like OS or RTE, mostly within a task. E.g.
      the main procedure of a SW component.


      Cycle time is explicitly not an attribute since this is handled in scope of the task. In case function owners want to
      determine in which task the runnable shall run, this shall be added as an integration hint.'
