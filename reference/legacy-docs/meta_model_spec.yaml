- id: CLASS_SWC_List
  type: mm-class
  title: swc-list
  class_id_prefix: SWC_List_
  long_name_english: Software Component List
  lifecycle_status: established
  section: Software Architecture
  description: 'A software component list is used to create lists of software components and software compositions and can
    represent deployment as well as other structuring aspects.


    Typical deployment-oriented usages are grouping SWCs by target or packaging, for example:


    * deployed on a specific HW, chip, container, binary, or image

    * integrated as part of a composition or AUTOSAR SWC

    * configured for trusted/MMU-related deployment modes

    * assigned to a function group for deployment planning


    A swc-list can also refer to another swc-list to define hierarchical structures, and one software component or composition
    may be referenced in multiple swc-lists (for example across several ECUs).'
  children:
  - id: REL_SWC_List_integrates
    type: mm-relation
    title: integrates
    target_classes:
    - CLASS_SWC
    - CLASS_SW_Comp
    - CLASS_SWC_List
    cardinality: 1..*
    lifecycle_status: established
    description: The attribute specifies the relation of the software component list to the software components and compositions
      which are integrated in scope of the swc-list.
