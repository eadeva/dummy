      to the software components and compositions.
- id: CLASS_SW_If
  type: mm-class
  title: sw-if
  class_id_prefix: SW_If_
  long_name_english: Software Interface
  lifecycle_status: established
  section: Software Architecture
  description: A software interface defines the contract for interaction between software components, specifying the methods,
    data, and protocols used for communication. It enables modularity and interoperability within the software architecture.
  children:
  - id: ATTR_SW_If_if_type
    type: mm-attribute
    title: if_type
    mandatory: true
    values:
    - client-server-interface
    - sender-receiver-interface
    - interface-header
    lifecycle_status: established
    description: The attribute specifies the type of interface. For AUTOSAR interfaces, please use 'client-server-interface'
      or 'sender-receiver-interface'. Otherwise use 'interface-header'.
  - id: CLASS_SW_If_SW_IfElm
    type: mm-class
    title: sw-ifelement
    class_id_prefix: SW_IfElm_
    long_name_english: Software Interface Element
    lifecycle_status: established
    description: A software interface element defines a single element of a software interface, such as a method or data structure.
    children:
    - id: ATTR_SW_If_SW_IfElm_arguments
      type: mm-attribute
      title: arguments
      mandatory: false
      values: string
      lifecycle_status: established
      description: 'The ``arguments`` attribute provides a semicolon-separated list of arguments for an ``ifelement_type``
        "operation". The names in ``arguments`` do not need to match the actual implementation; they should simply convey
        the purpose or nature of each input. Data types are not required, as they are considered implementation details and
        may not be known during the architectural definition phase. However, data types can be optionally included. For example
        when using


        * data types like float and double or

        * predefined interfaces, such as standardized AUTOSAR interfaces.'
    - id: ATTR_SW_If_SW_IfElm_ifelement_type
      type: mm-attribute
      title: ifelement_type
      mandatory: true
      values:
      - attribute
      - operation
      lifecycle_status: established
      description: The attribute specifies the type of interface element.
    - id: ATTR_SW_If_SW_IfElm_range
      type: mm-attribute
      title: range
      mandatory: false
      values: string
      lifecycle_status: established
      description: 'The attribute ``range`` specifies the range using mathematical interval notation:


        * Round brackets () indicate an open interval (value not included).


        * Square brackets [] indicate a closed interval (value included).


        * Curly brackets {} indicate a set and are used when only specific discrete values are allowed.


        Round and square brackets can also be mixed, if only one part of the internal is opened or closed.

        Inside the intervals, use commas to separate the values.

        All decimal values must use a point (.) as the decimal separator.


        For interface elements of type "operation", provide ``range`` as a semicolon-separated list, following the same order
        as ``arguments``.'
    - id: ATTR_SW_If_SW_IfElm_resolution
      type: mm-attribute
      title: resolution
      mandatory: false
      values: string
      lifecycle_status: established
      description: The attribute ``resolution`` defines the numerical resolution value. Optionally, include a SI-unit if the
        argument or attribute represents a physical quantity. For operation elements, specify a semicolon-separated list in
        ``resolution`` in the same order as in ``arguments``. If an argument has no resolution and no unit, use "na" (not
        applicable).
    - id: ATTR_SW_If_SW_IfElm_return_val
      type: mm-attribute
      title: return_val
      mandatory: false
      values: string
      lifecycle_status: established
      description: Defines the return value for an operation.
    - id: ATTR_SW_If_SW_IfElm_storage
      type: mm-attribute
      title: storage
      mandatory: false
      values: str
      lifecycle_status: phase-out
      description: Defines where the interface element is stored.
