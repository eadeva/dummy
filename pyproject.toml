[build-system]
requires = ["hatchling>=1.24", "pydantic>=2.6", "PyYAML>=6.0", "packaging>=23"]
build-backend = "hatchling.build"

[project]
name = "ptk"
dynamic = ["version"]
description = "ptk (project tool kit): a configuration-driven project CLI with variants, credentials, tool setup, logging and reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.5",  # Native PowerShell completion, also Bash/Zsh/Fish.
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "packaging>=23",
  "rich>=13.7",
  "rich-click>=1.8",
  "cryptography>=42",   # built-in credential vault (AES-GCM)
]

[project.optional-dependencies]
keyring = ["keyring>=24"]   # OS keyring provider (Windows Credential Manager, macOS, Secret Service)

[project.scripts]
ptk = "ptk.drivers.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=4,<5",  # Real Git hook installation/execution regression tests.
  "cmake==3.30.9",  # Native integration tests use this project's executable.
]

docs = ["sphinx==9.1.0"]
release = ["build>=1.2", "hatchling>=1.24", "editables>=0.3", "twine>=6", "pip>=24"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata.hooks.custom]
path = "hatch_metadata.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/examples", "/scripts", "/config/ptk",
  "/.claude/skills", "/.main.ptk.yml", "/README.md", "/pyproject.toml",
  "/.pre-commit-config.yaml",
  "/hatch_build.py", "/hatch_metadata.py", "/install",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.ptk", "**/.venv", "**/_build", "**/_builds", "**/_bin", "**/_logs", "**/_reports", "**/.gen.version.ptk.yml"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptk"]

[tool.uv]
# Editable metadata must be refreshed when Git history/tags or version config change.
cache-keys = [
  {file = "pyproject.toml"}, {file = ".main.ptk.yml"},
  {file = "config/ptk/**/*.ptk.yml"}, {file = "hatch_*.py"},
  {file = "src/ptk/package_version.py"}, {file = "PKG-INFO"},
  {file = "src/ptk/**/*.py"},
  {file = "extensions/project-toolkit/package*.json"},
  {file = "extensions/project-toolkit/src/**"},
  {file = "extensions/project-toolkit/media/**"},
  {file = "extensions/project-toolkit/test/**"},
  {file = "extensions/project-toolkit/README.md"},
  {file = "extensions/project-toolkit/.vscodeignore"},
  {git = {commit = true, tags = true}},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# ruff defaults (E4, E7, E9, F; line length 88) plus a few stricter rule sets
extend-select = ["I", "B", "UP", "SIM"]
