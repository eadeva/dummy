# PTK configuration: this file owns its section or named entity.
help: Write a demo artifact and run independent checks
params:
  message:
    default: Hello from ptk
    help: Text to put in the artifact
steps:
  prepare:
    run:
    - demo.py
    - prepare
    - ${params.message}
    python:
      interpreter: cli
  unit:
    run:
    - demo.py
    - test
    - ${params.message}
    python:
      interpreter: cli
    needs:
    - prepare
  extra:
    run:
    - demo.py
    - extra
    python:
      interpreter: cli
    when: core.CHECKS
    needs:
    - prepare
