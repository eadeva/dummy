[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ptk-example-tool"
version = "0.1.0"
requires-python = ">=3.12"
description = "Standalone Python CLI consumed by a PTK uv step"

[project.scripts]
ptk-example-check = "ptk_example_tool:main"

[tool.hatch.build.targets.wheel]
packages = ["ptk_example_tool"]
