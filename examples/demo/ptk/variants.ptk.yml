default: customer_a_high
components:
  core:
    features:
      LOG_LEVEL: {type: enum, values: [ERROR, WARN, INFO, DEBUG], default: INFO}
  display:
    requires_components: [core]
    features:
      DISPLAY_SIZE: {type: int, min: 5, max: 15, default: 8, help: Display diagonal in inch}
      TOUCH: {type: bool, help: Touch screen}
  navigation:
    requires_components: [display]
    features:
      MAP_REGION: {type: enum, values: [EU, US]}
      NAV_3D: {type: bool, depends_on: DISPLAY_SIZE >= 10}
  camera:
    requires_components: [display]
    features:
      NIGHT_VISION: {type: bool}
variants:
  base:
    abstract: true
    components: [core, display]
    features: {LOG_LEVEL: WARN}
    data: {toolchain: arm-gcc}
  customer_a_high:
    extends: base
    aliases: ["1", a_high]
    components: [core, display, navigation, camera]
    features: {DISPLAY_SIZE: 12, TOUCH: true, NAV_3D: true, NIGHT_VISION: true}
  customer_b_us:
    extends: base
    aliases: ["2", b_us]
    components: [core, display, navigation]
    features: {MAP_REGION: US}
    data: {toolchain: arm-clang}
