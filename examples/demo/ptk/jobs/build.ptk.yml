jobs:
  build:
    help: Configure and build the firmware
    params:
      build_type: {type: choice, choices: [Debug, Release], default: Release, help: CMake build type}
      jobs: {type: int, default: 8, env: PTK_JOBS, help: Parallel jobs}
      # per-variant default, taken from the variant's data
      toolchain: {default: "${vh.data.toolchain}", help: Compiler toolchain}
    steps:
      - configure:
          run: [cmake, --preset, "${vars.preset}", "-DCMAKE_BUILD_TYPE=${params.build_type}", "-DTOOLCHAIN=${params.toolchain}"]
      - compile:
          run: [cmake, --build, --preset, "${vars.preset}", -j, "${params.jobs}"]
      - checks:
          parallel: true
          steps:
            - lint:
                run: tools/lint.py
                python: {uvx: "ruff==0.6.9"}
            - camera-selftest:
                run: tools/camera_selftest.sh
                when: COMPONENT_CAMERA and DISPLAY_SIZE >= 10
