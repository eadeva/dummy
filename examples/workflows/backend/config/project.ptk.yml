project: {name: backend}
environment: {set: {PROJECT_IDENTITY: backend}}
variants:
  default: debug
  variants:
    debug: {}
    release: {}
jobs:
  test:
    params:
      suite: {type: choice, default: unit, choices: [unit, smoke]}
    steps:
      - tests: {uses: echo, with: {message: "Testing ${env.PROJECT_IDENTITY}: ${params.suite} (${vh.variant})"}}
