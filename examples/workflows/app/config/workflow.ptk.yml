workflows:
  verify:
    help: Build the frontend, then run independent checks locally
    max_workers: 2
    steps:
    - build:
        job: build
    - checks:
        parallel: true
        steps:
        - unit:
            job: test
        - backend:
            repo: backend
            job: test
            params:
              suite: smoke
  all:
    help: Run both repositories using the selected owner variant
    parallel: true
    steps:
    - frontend:
        job: test
    - backend:
        repo: backend
        job: test
