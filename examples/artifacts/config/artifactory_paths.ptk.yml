# PTK configuration: this file owns its section or named entity.
url: https://artifacts.example.com/artifactory
repository: generic-ci-local
base_path: projects/${project.alias}
events:
  push:
    branch:
      path: branches/${github.ref_name}/${date.timestamp}/${github.run_id}-${github.run_attempt}
    tag:
      path: tags/${version.current.sort_key}_v${version.current.value}
  pull_request:
    path: pull-requests/${github.event.pull_request.number}/${github.run_id}-${github.run_attempt}
  workflow_dispatch:
    path: manual/${date.utc.timestamp}/${github.run_id}-${github.run_attempt}
  schedule:
    path: scheduled/${date.utc.timestamp}/${github.run_id}-${github.run_attempt}
  release:
    repository: generic-releases-local
    path: releases/${version.current.sort_key}_v${version.current.value}
jobs:
  package:
    path: packages/${run.variant}
  test:
    path: test-reports/${run.variant}
  docs:
    path: documentation/${run.variant}
