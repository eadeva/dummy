# Keep commands isolated while allowing package access and the optional GUI tests.
# The test job alone inherits PATH because it exercises host-installed tools.
environment:
  isolate: true
  inherit_path: false
  keep:
    - PTK_UV
    - UV_PYTHON
    - UV_CACHE_DIR
    - UV_INDEX_URL
    - UV_EXTRA_INDEX_URL
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY
    - SSL_CERT_FILE
    - REQUESTS_CA_BUNDLE
    - DISPLAY
    - XAUTHORITY
