# Keep commands isolated while allowing package access.
# Test and extension jobs inherit PATH for their host-installed tools.
environment:
  isolate: true
  inherit_path: false
  keep:
    - PTK_UV
    - UV_PYTHON
    - UV_CACHE_DIR
    - UV_INDEX_URL
    - UV_EXTRA_INDEX_URL
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY
    - SSL_CERT_FILE
    - REQUESTS_CA_BUNDLE
    - NODE_EXTRA_CA_CERTS
    - NPM_CONFIG_REGISTRY
    - NPM_CONFIG_USERCONFIG
    - NPM_CONFIG_CACHE
    - npm_config_registry
    - npm_config_userconfig
    - npm_config_cache
    - PTK_TEST_PYTHON
