# First action: try `ptk hello --message "Hello" -V debug`.
actions:
  hello:
    help: Print a message and the selected project version
    params:
      message:
        default: Hello from ptk
        help: Message to display
    steps:
    - greet:
        uses: echo
        with:
          message: ${params.message}
    - version:
        uses: echo
        with:
          message: Version ${version.projects.dummy.value} (${vh.variant})
# Action options (place alongside help/params/steps):
#     audience: maintainer  # Restrict this action to listed maintainers.
#     env: {GREETING_STYLE: friendly}  # Applies only to this action.
