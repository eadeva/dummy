# Build and validate release artifacts locally. This action never uploads anything.
# The script consumes PTK_VERSION_PTK from this run's Git-managed version snapshot.
actions:
  package:
    help: Prepare Python distributions and offline documentation for Artifactory
    steps:
      - prepare:
          python: {project: ., groups: [release, docs]}
          run: [python, scripts/prepare_package.py, --output, "${run.bin_dir}/package"]
          timeout: 900
