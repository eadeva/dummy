# PTK's developer tools are Python dependencies in pyproject.toml:
# dev = pytest + ruff + cmake; docs = sphinx. Jobs select those uv project groups.
# uv is bootstrapped by install/install.sh or install/install.ps1.
# Only the extension job needs a host Node.js installation (which includes npm).
tools:
  node:
    description: Node.js 22 or newer; install Node.js including npm and reopen the terminal
    version: ">=22"
    check: node --version
  npm:
    description: npm, included with Node.js
    check: npm --version
requires_tools: {}
