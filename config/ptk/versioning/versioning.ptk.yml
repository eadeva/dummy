# Package metadata uses this Git-managed project version too.
# Untagged/shallow checkouts use the explicit development fallback below.
# Source distributions retain their resolved version without requiring Git.
versioning:
  project:
    source: git
    match: "v*"
    strip_prefix: v
    dirty: suffix
    fallback:
      source: literal
      version: "0.1.0.dev0"
