# Prefer reachable release tags. Untagged/source/shallow checkouts use package metadata.
# This discovers versions only; it does not change the package version or Git tags.
versioning:
  project:
    source: git
    match: "v*"
    strip_prefix: v
    dirty: suffix
    fallback:
      source: file
      path: pyproject.toml
      format: toml
      key: project.version
