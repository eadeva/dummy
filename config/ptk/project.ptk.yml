# Composition root: includes are relative to this file.
# Add actions as separate files under actions/; the glob loads them.
schema_version: 1
include:
- tools/tools.ptk.yml
- versioning/versioning.ptk.yml
- environment/environment.ptk.yml
- credentials/credentials.ptk.yml
- configs/configs.ptk.yml
- actions/*.ptk.yml
project:
  name: ptk
  default_action: test
variants: variants/variants.ptk.yml
# Test dependencies and doc dependencies are declared once in pyproject.toml.
# Each action runs this checkout, even when the invoking PTK was installed globally.
