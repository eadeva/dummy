# PTK configuration: this file owns its section or named entity.
help: Prepare Python distributions and offline documentation for Artifactory
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/package
steps:
- prepare:
    python:
      project: .
      groups:
      - release
      - docs
    run:
    - python
    - scripts/prepare_package.py
    - --output
    - ${run.bin_dir}
    timeout: 900
