# PTK configuration: this file owns its section or named entity.
help: Prepare Python distributions with the VS Code extension and offline documentation
requires_tools:
- node
- npm
environment:
  inherit_path: true
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/package
# Explicit report artifact; PTK completes its contents before the upload Action runs.
outputs:
- path: ${run.reports_dir}
  artifact_type: package-reports
steps:
  prepare:
    # Contains dist/, docs/, SHA256SUMS and the release manifest.
    outputs:
    - path: ${run.bin_dir}
      artifact_type: release-bundle
    python:
      project: .
      groups:
      - release
      - docs
    run:
    - python
    - scripts/prepare_package.py
    - --output
    - ${run.bin_dir}
    timeout: 900
