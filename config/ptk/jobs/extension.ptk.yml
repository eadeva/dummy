# PTK configuration: this file owns its section or named entity.
help: Build and test the Project Toolkit VS Code extension (VSIX)
requires_tools:
- node
- npm
environment:
  inherit_path: true
# Explicit report artifact; PTK completes its contents before the upload Action runs.
outputs:
- path: ${run.reports_dir}
  artifact_type: extension-reports
steps:
  dependencies:
    cwd: ${project.root}/extensions/project-toolkit
    run:
    - npm
    - ci
    - --include=dev
    timeout: 600
  package:
    outputs:
    - path: ${run.bin_dir}/project-toolkit.vsix
      artifact_type: vscode-extension
    cwd: ${project.root}/extensions/project-toolkit
    run:
    - npm
    - run
    - package
    - --
    - --out
    - ${run.bin_dir}/project-toolkit.vsix
    timeout: 600
    needs:
    - dependencies
