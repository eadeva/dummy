# PTk configuration: this file owns its section or named entity.
help: Build PTk's Sphinx documentation with warnings treated as errors
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/docs
# Explicit report artifact; PTk completes its contents before the upload Action runs.
outputs:
- path: ${run.reports_dir}
  artifact_type: docs-reports
steps:
  sphinx:
    outputs:
    - path: ${run.build_dir}/html
      artifact_type: documentation
    python:
      project: .
      groups:
      - docs
    run:
    - python
    - -m
    - sphinx
    - -W
    - --keep-going
    - -b
    - html
    - docs
    - ${run.build_dir}/html
    passthrough: true
    timeout: 600
