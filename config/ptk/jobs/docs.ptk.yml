# PTK configuration: this file owns its section or named entity.
help: Build PTK's Sphinx documentation with warnings treated as errors
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/docs
steps:
  sphinx:
    python:
      project: .
      groups:
      - docs
    run:
    - python
    - -m
    - sphinx
    - -W
    - --keep-going
    - -b
    - html
    - docs
    - ${run.build_dir}/html
    passthrough: true
    timeout: 600
