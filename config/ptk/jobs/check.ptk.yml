# PTK configuration: this file owns its section or named entity.
help: Check PTK's lint rules and formatting
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/check
steps:
- lint:
    python:
      project: .
      groups:
      - dev
    run:
    - python
    - -m
    - ruff
    - check
    timeout: 120
- format:
    python:
      project: .
      groups:
      - dev
    run:
    - python
    - -m
    - ruff
    - format
    - --check
    timeout: 120
