# PTK configuration: this file owns its section or named entity.
help: Check PTK's lint rules and formatting
env:
  UV_PROJECT_ENVIRONMENT: ${project.root}/.ptk/venvs/check
# Explicit report artifact; PTK completes its contents before the upload Action runs.
outputs:
- path: ${run.reports_dir}
  artifact_type: check-reports
steps:
  lint:
    python:
      project: .
      groups:
      - dev
    run:
    - python
    - -m
    - ruff
    - check
    timeout: 120
  format:
    python:
      project: .
      groups:
      - dev
    run:
    - python
    - -m
    - ruff
    - format
    - --check
    timeout: 120
    needs:
    - lint
