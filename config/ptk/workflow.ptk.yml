# Each action uses its own uv environment under .ptk/venvs.
workflows:
  verify:
    help: Run check, test and package in order, alongside documentation
    parallel: true
    max_workers: 2
    steps:
      - quality:
          steps:
            - check: {action: check}
            - test: {action: test}
            - package: {action: package}
      - docs: {action: docs}
