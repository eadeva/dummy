# Actions use separate uv environments so docs can run in parallel.
workflows:
  verify:
    help: Run check, test and package in order, alongside documentation
    open_report: always  # default; use on-errors to open only when errors occur
    parallel: true
    max_workers: 2
    steps:
      - quality:
          steps:
            - check: {action: check}
            - test: {action: test}
            - package: {action: package}
      - docs: {action: docs}
