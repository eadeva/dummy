# Generated by ptk from base pre-commit v1 + overlay config/ptk/configs/pre-commit.overlay.yaml - do not edit.
# To change it: edit config/ptk/configs/pre-commit.overlay.yaml, then run 'ptk setup configs sync'.
default_install_hook_types:
- pre-commit
exclude: \.log$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args:
    - --fix=lf
  - id: check-yaml
    args:
    - --allow-multiple-documents
  - id: check-toml
  - id: check-json
  - id: check-merge-conflict
  - id: check-added-large-files
    args:
    - --maxkb=1024
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.9
  hooks:
  - id: ruff-check
    args:
    - --fix
  - id: ruff-format
